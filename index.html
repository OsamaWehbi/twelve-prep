<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://api.openverse.org https://commons.wikimedia.org https://*.wikimedia.org https://api.anthropic.com https://*.firebaseapp.com; frame-src https://celpip-prep-3a239.firebaseapp.com https://accounts.google.com; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="robots" content="noindex,nofollow"></head><body>
<title>Twelve Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column app shell (max 1080px); test parts split passage | questions at >=900px, stacked on phones */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#E8EEF1; --ink:#12202A; --muted:#566874; --line:#D3DCE2;
  --accent:#2A6CB0; --accent-ink:#FFFFFF; --accent-soft:#E7F2F8;
  --amber:#A85F00; --amber-soft:#FBEBD2; --good:#1D7540; --good-soft:#DCF0E2; --bad:#B3261E; --bad-soft:#F8DEDB;
  --c-l:#2F6FB5; --c-r:#7A4BB0; --c-w:#0E6B66; --c-s:#C2541B;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --radius:10px; --shade:rgba(18,32,42,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151B; --surface:#14212A; --surface-2:#1B2A34; --ink:#E5EEF2; --muted:#93A7B3; --line:#2A3B46;
  --accent:#6AA9E9; --accent-ink:#071A2B; --accent-soft:#132B40;
  --amber:#F0A63A; --amber-soft:#3A2A10; --good:#5BC27F; --good-soft:#123321; --bad:#F1786F; --bad-soft:#3A1715;
  --c-l:#6FA8E8; --c-r:#B48AE6; --c-w:#3FB8AE; --c-s:#F08A50; --shade:rgba(0,0,0,.55); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D151B; --surface:#14212A; --surface-2:#1B2A34; --ink:#E5EEF2; --muted:#93A7B3; --line:#2A3B46;
  --accent:#6AA9E9; --accent-ink:#071A2B; --accent-soft:#132B40;
  --amber:#F0A63A; --amber-soft:#3A2A10; --good:#5BC27F; --good-soft:#123321; --bad:#F1786F; --bad-soft:#3A1715;
  --c-l:#6FA8E8; --c-r:#B48AE6; --c-w:#3FB8AE; --c-s:#F08A50; --shade:rgba(0,0,0,.55); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--accent)}
.field{font:inherit;width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.field:disabled{opacity:.5}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 72px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;font-weight:700}
h1{font-size:clamp(30px,5.2vw,46px);letter-spacing:-.01em}
h2{font-size:24px} h3{font-size:18px}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:21px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:700}
nav{display:flex;gap:4px;flex-wrap:wrap}
.navb{font:inherit;font-weight:600;font-size:15px;background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer}
.navb[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:14px 20px;font-size:16px}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.muted{color:var(--muted)} .small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--accent))}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surface-2)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.note{border-left:4px solid var(--amber);background:var(--amber-soft);padding:12px 14px;border-radius:0 8px 8px 0}
.hero{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:880px){.hero{grid-template-columns:1.25fr 1fr;align-items:center}}
.hero .lede{max-width:58ch;font-size:17px}
/* signature: the CELPIP 12-level scale */
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.cell{font-family:var(--mono);font-size:11px;text-align:center;padding:4px 0;border-radius:4px;background:var(--surface-2);color:var(--muted);position:relative;font-variant-numeric:tabular-nums}
.cell.on{background:var(--accent);color:var(--accent-ink)}
.cell.tgt{box-shadow:inset 0 0 0 2px var(--amber)}
.skillrow{display:grid;grid-template-columns:74px minmax(0,1fr) 30px;gap:10px;align-items:center}
.skillrow b{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.sec-card{border-top:4px solid var(--dot)}
.partlist{display:flex;flex-direction:column;gap:6px}
.partbtn{font:inherit;text-align:left;display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.partbtn:hover{border-color:var(--accent)}
.partbtn span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
/* runner */
.runbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.runinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:8px;background:var(--surface-2)}
.timer.low{color:var(--bad);background:var(--bad-soft)}
.split{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:900px){.split{grid-template-columns:1.1fr 1fr;align-items:start}.split>.sticky{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.passage p{margin:0 0 12px;max-width:68ch}
.passage h3{margin:6px 0 8px}
.pblock{padding-bottom:12px;border-bottom:1px dashed var(--line)}
.pblock:last-child{border-bottom:0}
select.gap{font:inherit;font-size:15px;padding:2px 6px;border-radius:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);max-width:100%}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:600}
.q{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.qtext{font-weight:600;display:flex;gap:10px}
.qn{font-family:var(--mono);font-size:13px;min-width:26px;height:26px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.player{align-items:center;text-align:center;padding:36px 20px}
.now{min-height:24px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c-l);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin,.dot{animation:none}}
.center{align-items:center;text-align:center;padding:40px 20px}
textarea{width:100%;min-height:280px;font:inherit;line-height:1.6;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.spwrap{position:relative;border-radius:8px;background:var(--surface)}
.spwrap textarea{position:relative;z-index:1;background:transparent;display:block}
.spmirror{position:absolute;inset:0;z-index:0;overflow:hidden;font:inherit;line-height:1.6;padding:14px;border:1px solid transparent;border-radius:8px;white-space:pre-wrap;overflow-wrap:break-word;word-wrap:break-word;color:transparent;pointer-events:none}
.spmirror mark{background:none;color:transparent;text-decoration:underline wavy var(--bad);text-decoration-thickness:1.5px;text-underline-offset:3px;-webkit-text-decoration:underline wavy var(--bad)}
.spfix{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;min-height:0}
.spfix button{font:inherit;font-size:.9em;padding:4px 10px;border-radius:999px;border:1px solid var(--bad);background:var(--bad-soft);color:var(--ink);cursor:pointer}
.spfix button b{color:var(--bad);font-weight:600}
.bigtime{font-family:var(--mono);font-weight:700;font-size:48px;font-variant-numeric:tabular-nums;line-height:1}
.rec{color:var(--bad)}
.mic{width:100%}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.scene{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff}
.photo{margin:0}.photo .scene{display:block;max-height:62vh;object-fit:contain;background:var(--surface)}.photo figcaption{margin-top:4px;overflow-wrap:anywhere}
.optcard{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.optcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.optcard ul{margin:0;padding-left:18px}
.rv{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.mk{font-weight:700;margin-right:4px}
.rv.ok .mk{color:var(--good)} .rv.bad .mk{color:var(--bad)}
.levelbig{font-family:var(--mono);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.dims{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.dimhead{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent)}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
.del{text-decoration:line-through;color:var(--bad)} .ins{color:var(--good);font-weight:600}
ul.tight{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;background:var(--c)}
.chart{width:100%;height:auto;display:block}
.toggle{display:inline-flex;gap:8px;align-items:center;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
select.plain{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
/* exam window: framed test screen with header bar, grey prompt panel, tinted answer panel */
.exam{border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;font-family:"Fira Sans","Trebuchet MS","Helvetica Neue",Arial,sans-serif;font-size:15px}
.exam h1,.exam h2,.exam h3{font-family:inherit}
.exam .runbar{background:linear-gradient(var(--surface),var(--surface-2))}
/* listening speaker panel; Part 5 is framed like the discussion video */
.stage{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding:18px;border-radius:8px;background:var(--surface-2)}
.stage.video{background:#1E2B34;align-items:center;min-height:200px;max-width:640px;width:100%;margin:0 auto;position:relative}
.stage.video::after{content:"Discussion";position:absolute;left:12px;top:10px;font-size:12px;color:#B9C7D0;letter-spacing:.06em;text-transform:uppercase}
.stage.video .person span:last-child{color:#E3EAEE}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.face{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:24px;color:#fff;background:hsl(var(--h) 42% 42%);transition:box-shadow .2s}
.person.talk{transform:scale(1.08)}
.person.talk .face{box-shadow:0 0 0 4px var(--accent)}
@media (prefers-reduced-motion: reduce){.person,.face{transition:none}}
.exam .runbar{background:var(--surface-2);padding:10px 14px;border-bottom:1px solid var(--line)}
.exam .runbar strong{font-size:15px}
.exam #runbody{padding:14px;min-height:60vh}
.exam .timer{background:none;font-size:14px;padding:0}
.exam .tlabel{font-size:13px;color:var(--muted)}
.exam .btn{border-radius:2px}
/* exam panels: reading (left) and questions (right) each scroll on their own inside a fixed-height exam window;
   soft edge shadows appear only when a panel has more content above or below (background-attachment trick) */
.exam .split>.card:first-child{--panel:var(--surface-2);border:0;border-radius:0}
.exam .split>.card:last-child{--panel:var(--accent-soft);border:1px solid var(--line);border-radius:0}
.exam .split>.card{
  background-color:var(--panel);
  background-image:linear-gradient(var(--panel) 30%,transparent),linear-gradient(transparent,var(--panel) 70%),radial-gradient(farthest-side at 50% 0,var(--shade),transparent),radial-gradient(farthest-side at 50% 100%,var(--shade),transparent);
  background-position:0 0,0 100%,0 0,0 100%;background-size:100% 36px,100% 36px,100% 12px,100% 12px;background-repeat:no-repeat;background-attachment:local,local,scroll,scroll;
  scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 55%,transparent) transparent}
.exam .split>.card::-webkit-scrollbar{width:10px}
.exam .split>.card::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 50%,transparent);border-radius:6px;border:2px solid var(--panel)}
.exam .split>.card:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.exam .runbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
@media (min-width:900px){
  .exam .split{height:clamp(440px,calc(100vh - 150px),1200px);height:clamp(440px,calc(100dvh - 150px),1200px);grid-template-rows:minmax(0,1fr);align-items:stretch}
  .exam .split>.card,.exam .split>.sticky{position:static;max-height:none;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
}
@media (max-width:899px){
  .exam .split>.card:first-child{max-height:55vh;max-height:55dvh;overflow-y:auto;overscroll-behavior:contain}
}
.exam .card .eyebrow{color:var(--accent);font-size:14px;letter-spacing:0;text-transform:none}
.exam .card .eyebrow::before{content:"i";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;margin-right:6px;font-style:italic}
.exam .nextbtn{padding:5px 16px;font-size:13px;letter-spacing:.06em}
.exam .tlabel b{color:var(--ink)}
.exam .ihead{color:var(--accent);font-weight:600;display:flex;gap:8px;align-items:flex-start;max-width:72ch}
.exam .ihead::before{content:"i";flex:none;display:inline-grid;place-items:center;width:18px;height:18px;margin-top:2px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-style:italic;font-weight:700}
.exam .ibul{color:var(--accent);font-weight:600;gap:10px}
.exam .spk{gap:16px}
.exam .spkans{display:flex;flex-direction:column;gap:10px}
.statusbox{display:flex;gap:16px;align-items:center;background:var(--surface-2);border-radius:8px;padding:14px 22px;margin:6px auto;width:min(100%,380px)}
.exam .split>.card:first-child .statusbox{background:var(--surface)}
.exam .split>.card:first-child .statusbox .ico{background:var(--surface-2)}
.statusbox .ico{width:44px;height:44px;flex:none;border-radius:6px;background:var(--surface);display:grid;place-items:center;font-size:20px;color:var(--muted)}
.statusbox .ico.rec{color:var(--bad)}
.statusbox .sb-main{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.statusbox .lbl{font-weight:600;text-align:center}
.statusbox .val{font-family:var(--mono);color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.pbar{height:10px;background:var(--surface);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s linear}
@media (prefers-reduced-motion: reduce){.pbar i{transition:none}}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.exam .qsplit{border-top:1px solid var(--line);margin:8px 0}
.exam .examfoot{background:var(--surface-2);border-top:1px solid var(--line);padding:8px 14px;display:flex;justify-content:flex-end}
.transcript p{margin:0 0 6px}
.transcript b{color:var(--muted)}
</style>

<div id="app"></div>

<script>
/* ---------- constants ---------- */
const SEC_ORDER = ['listening','reading','writing','speaking'];
const SECTIONS = {
  listening:{name:'Listening',color:'var(--c-l)',time:'about 47 min',parts:[
    {key:'L1',name:'Part 1 · Problem Solving',q:8,segs:[3,2,3],words:'550-650',speakers:'Exactly 2 speakers.',desc:'A conversation between two people in which one person has a problem and the other helps to solve it (for example a customer and a service agent, or two neighbours). It is heard in 3 consecutive sections.'},
    {key:'L2',name:'Part 2 · Daily Life Conversation',q:5,segs:[5],words:'300-380',speakers:'Exactly 2 speakers.',desc:'A casual everyday conversation between two people (friends, co-workers or family).'},
    {key:'L3',name:'Part 3 · Listening for Information',q:6,segs:[6],words:'400-480',speakers:'Exactly 2 speakers.',desc:'A conversation in which one person gives detailed information to another (an advisor, clerk or coordinator explaining a program, service or process).'},
    {key:'L4',name:'Part 4 · News Item',q:5,segs:[5],words:'260-320',speakers:'Exactly 1 speaker (a news reporter), split into 4-6 lines, one per paragraph.',desc:'A single news reporter presenting a local Canadian news story.'},
    {key:'L5',name:'Part 5 · Discussion',q:8,segs:[8],words:'550-650',speakers:'Exactly 3 speakers.',desc:'A discussion among three people (co-workers in a meeting, family members, or community members) who weigh options and reach a decision.'},
    {key:'L6',name:'Part 6 · Viewpoints',q:6,segs:[6],words:'420-500',speakers:'Exactly 1 speaker (a radio host), split into 5-8 lines, one per paragraph.',desc:'A single speaker reporting on a public issue and presenting two contrasting viewpoints with their supporting arguments.'}

        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {

function chart(target){
  const atts = S.attempts.filter(a => a.level != null).slice(-30);
  if (atts.length < 2) return `<p class="muted">The chart appears after two or more attempts.</p>`;
  const W = 680, H = 260, pl = 34, pr = 14, pt = 12, pb = 30, n = atts.length;
  const x = i => pl + i * (W - pl - pr) / (n - 1);
  const y = l => pt + (12 - l) / 12 * (H - pt - pb);
  let g = '';
  const T = 'style="fill:var(--muted);font-family:var(--mono);font-size:11px"';
  [0,3,6,9,12].forEach(l => { g += `<line x1="${pl}" x2="${W-pr}" y1="${y(l)}" y2="${y(l)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(l)+4}" text-anchor="end" ${T}>${l}</text>`; });
  g += `<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" style="stroke:var(--amber)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  SEC_ORDER.forEach(s => {
    const pts = atts.map((a,i) => a.section === s ? [x(i), y(a.level)] : null).filter(Boolean);
    if (!pts.length) return;
    g += `<polyline style="fill:none;stroke:${SECTIONS[s].color}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
    pts.forEach((p, k) => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="${k === pts.length-1 ? 5 : 3.5}" style="fill:${SECTIONS[s].color};stroke:var(--surface)" stroke-width="1.5"/>`; });
  });
  g += `<text x="${pl}" y="${H-8}" ${T}>${dateStr(atts[0].ts)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end" ${T}>${dateStr(atts[n-1].ts)}</text>`;
  return `<div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Levels over time">${g}</svg></div>`;
}

function countdown(seconds, el, onEnd, lowAt=60, onTick){
  const run = S.run, end = Date.now() + seconds * 1000;

  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    if (el && el.isConnected) { el.textContent = fmt(left); el.classList.toggle('low', left <= lowAt); }
    if (onTick) onTick(left, seconds);
    if (left <= 0) { clearInterval(id); if (S.run === run) onEnd(); }

  run.timers.push(stop);

}

async function loadPart(){

      shell(`<div class="card center"><div class="spin" aria-hidden="true"></div><h3>Trying again…</h3><p class="muted small">The first attempt didn’t work (${esc((e && e.code) || 'error')}), so a fresh one is being made automatically.</p></div>`);
      await sleep(2500);
      if (S.run !== run || run.idx !== i) return;
      run.gens[i] = null;
      return loadPart();
    }
    const via = provider() ? `Using ${PNAME[provider()]}${provider() === 'gemini' ? ' · model ' + S.ai.geminiModel + (S.ai.geminiBackup ? ', backup ' + S.ai.geminiBackup : '') : provider() === 'anthropic' ? ' · model ' + S.ai.anthropicModel : ''}.` : '';
    shell(`<div class="card center"><h3>This part couldn't be prepared</h3><p class="muted">${esc(errMsg(e))}</p><p class="small muted">${esc(via)}${e && e.code ? ' Error code: ' + esc(e.code) + '.' : ''}${e && e.detail ? '<br>Reply began: “' + esc(e.detail) + '”' : ''}</p><div class="row"><button class="btn primary" data-act="retry">Try again</button></div></div>`);
    return;
  }
  if (S.run !== run || run.idx !== i) return;
  ensure(i + 1);
  ({listening:renderListening, reading:renderReading, writing:renderWriting, speaking:renderSpeaking})[run.section](data, p);
}
function finishPart(r){
  const run = S.run;
  clearTimers(); stopAudio();
  run.results.push(r);
  if (run.idx < run.parts.length - 1) { run.idx++; loadPart(); }
  else endRun();
}
function quitRun(){
  stopAudio(); clearTimers();
  try { if (C.dict && C.dict.active()) C.dict.stop(); } catch(e) {}
  recCancel();
  srStop(); srRec = null;
  dictTarget = null; S.run = null; S.view = 'home'; render();
}

/* exam helpers */
const SKIP_MSG = 'You have not answered every question on this page. On test day, once you go to the next page you cannot come back to change your answers.';
function setNext(fn, label){
  const b = $('#nextBtn'); if (!b) return;
  b.hidden = !fn; b.textContent = label || 'NEXT'; b.onclick = fn || null;
}
function confirmSkip(message, onSkip){
  $$('.modalback').forEach(m => m.remove());
  const back = document.createElement('div');
  back.className = 'modalback';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><h3 id="mtitle">Before you go on</h3><p>${esc(message)}</p><div class="row"><button class="btn" id="mStay">Stay on this page</button><button class="btn primary" id="mSkip">Go to the next page anyway</button></div></div>`;
  document.body.appendChild(back);
  const close = () => back.remove();
  back.querySelector('#mStay').onclick = close;
  back.querySelector('#mSkip').onclick = () => { close(); onSkip(); };
  back.querySelector('#mStay').focus();
}
function partTimerSecs(secs, onEnd){
  const el = $('#timer'); el.hidden = false; const tl = $('#tlabel'); if (tl) tl.hidden = false;
  return countdown(secs, el, onEnd, Math.min(60, Math.ceil(secs / 3)));
}
const statusBox = (icon, label, inner, rec) => `<div class="statusbox"><span class="ico${rec ? ' rec' : ''}" aria-hidden="true">${icon}</span><div class="sb-main"><div class="lbl" id="sbLabel">${label}</div>${inner}</div></div>`;

/* listening */
function mcHTML(q, name, num){
  return `<div class="q"><p class="qtext"><span class="qn">${num}</span><span>${esc(q.q)}</span></p><div class="opts">${q.options.map((o,j) => `<label class="opt"><input type="radio" name="${name}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</div></div>`;
}
function chosen(name){ const el = $(`input[name="${name}"]:checked`); return el ? +el.value : null; }
function renderListening(data, p){
  const run = S.run, segs = data.segments, mock = run.mode === 'mock';
  const picked = segs.map(s => s.questions.map(() => null));
  const total = segs.reduce((n, s) => n + s.questions.length, 0);
  let seg = 0;
  const transcriptHTML = lines => `<div class="transcript small">${lines.map(l => `<p><b>${esc(l.speaker)}:</b> ${esc(l.text)}</p>`).join('')}</div>`;
  function intro(){
    shell(`<div class="card"><h3>Listening: ${esc(p.name.replace(/^Part \d+ · /, ''))}</h3><ul class="tight ibul">
      ${segs.length > 1
        ? `<li>You will hear a conversation in ${segs.length} sections. You will hear each section only once.</li><li>After each section, you will answer ${segs.map(s => s.questions.length).join(', then ')} questions, one at a time. You will hear each question only once.</li>`
        : `<li>You will hear the recording only once.</li><li>Then you will answer ${total} questions, one at a time. You will hear each question only once.</li>`}
      <li>Choose the best answer to each question.</li>
      ${mock ? '' : '<li>Practice mode: you can replay the recording and read each question on screen.</li>'}</ul></div>`);
    setNext(() => listen());
    prefetchVoices(segs[0].script);
  }
  function listen(){
    if (seg > 0) prefetchVoices(segs[seg].script);
    const lines = segs[seg].script;
    const speakers = [...new Set(lines.map(l => l.speaker))];
    shell(`<div class="card">
      <p class="ihead">${p.key === 'L5' ? 'Watch and listen to the discussion. You will hear it only once.' : `Listen to the ${segs.length > 1 ? `conversation (section ${seg+1} of ${segs.length})` : 'recording'}. You will hear it only once.`}</p>
      ${seg === 0 && data.context ? `<p>${esc(data.context)}</p>` : ''}
      <div class="stage${p.key === 'L5' ? ' video' : ''}">${speakers.map((s, i) => `<div class="person" data-sp="${esc(s)}"><span class="face" style="--h:${(i * 97 + 200) % 360}" aria-hidden="true">${esc((s[0] || '?').toUpperCase())}</span><span class="small">${esc(s)}</span></div>`).join('')}</div>
      ${statusBox('🔊', 'Playing…', '<div class="pbar"><i id="pb"></i></div>')}
      <p id="now" class="small muted" style="text-align:center"></p>
      <div id="fallback" hidden></div>
      ${mock ? '' : '<div class="row" style="justify-content:center"><button class="btn" id="replay" hidden>↻ Replay</button></div>'}
    </div>`);
    const go = () => { stopAudio(); questions(0); };
    setNext(mock ? null : go);
    const start = () => {
      const l = $('#sbLabel'); if (l) l.textContent = useGeminiVoices() ? 'Preparing the audio…' : 'Playing…';
      playScript(lines, i => {
        const sl = $('#sbLabel'); if (sl && sl.textContent !== 'Playing…') sl.textContent = 'Playing…';
        const pb = $('#pb'); if (pb) pb.style.width = Math.round((i + 1) / lines.length * 100) + '%';
        const n = $('#now'); if (n && lines[i]) n.textContent = lines[i].speaker + ' is speaking';
        if (lines[i]) $$('.person').forEach(x => x.classList.toggle('talk', x.dataset.sp === lines[i].speaker));
      }).then(() => done(false), () => done(true));
    };
    function done(failed){
      if (S.run !== run || !$('#pb')) return;
      $('#pb').style.width = '100%';
      $('#sbLabel').textContent = failed ? 'Audio unavailable' : 'Finished';
      $$('.person').forEach(x => x.classList.remove('talk'));
      $('#now').textContent = '';
      if (failed) {
        const f = $('#fallback'); f.hidden = false;
        f.innerHTML = `<p class="note small">Audio isn't available in this browser, so read the transcript instead. Chrome or Edge usually play it.</p>${transcriptHTML(lines)}`;
        setNext(go); return;
      }
      if (mock) { go(); return; }
      const r = $('#replay'); if (r) { r.hidden = false; r.onclick = () => { r.hidden = true; start(); }; }
    }
    start();
  }
  function questions(k){
    const qs = segs[seg].questions, q = qs[k];
    const num = segs.slice(0, seg).reduce((n, s) => n + s.questions.length, 0) + k + 1;
    shell(`<div class="split">
      <div class="card">
        <p class="ihead">Listen to the question. You will hear it only once.</p>
        ${statusBox('🔊', 'Playing…', '<div class="pbar"><i id="pb"></i></div>')}
        <p id="qtext" class="qtext" ${mock ? 'hidden' : ''}>${esc(q.q)}</p>
      </div>
      <div class="card">
        <p class="small muted">Question ${num} of ${total}</p>
        <p class="ihead">Choose the best answer to each question.</p>
        <div class="opts">${q.options.map((o,j) => `<label class="opt"><input type="radio" name="lq" value="${j}" ${picked[seg][k] === j ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>
      </div></div>`);
    let moved = false;
    const advance = () => {
      if (moved || S.run !== run) return; moved = true;
      picked[seg][k] = chosen('lq');
      stopAudio(); clearTimers(); $$('.modalback').forEach(m => m.remove());
      if (k < qs.length - 1) questions(k + 1);
      else if (seg < segs.length - 1) { seg++; listen(); }
      else finish();
    };
    setNext(() => { if (chosen('lq') == null) confirmSkip(SKIP_MSG, advance); else advance(); });
    const afterAudio = failed => {
      if (S.run !== run || moved) return;
      const pb = $('#pb'); if (pb) pb.style.width = '100%';
      const l = $('#sbLabel'); if (l) l.textContent = failed ? 'Read the question below' : 'Finished';
      if (failed) { const t = $('#qtext'); if (t) t.hidden = false; }
      if (mock) partTimerSecs(30, advance);
    };
    playFallback([{speaker:'Narrator', gender:'female', text:q.q}], () => { const pb = $('#pb'); if (pb) pb.style.width = '50%'; })
      .then(() => afterAudio(false), () => afterAudio(true));
  }
  function finish(){
    const items = []; segs.forEach((s, si) => s.questions.forEach((q, k) => items.push({...q, chosen:picked[si][k]})));
    finishPart({type:'mc', key:p.key, name:p.name, title:data.title, items, correct:items.filter(it => it.chosen === it.answer).length, total:items.length, transcript:segs.flatMap(s => s.script)});
  }
  intro();
}

/* reading: each part is split into pages like the real test, one question type per page */
function renderReading(data, p){
  const run = S.run, qs = data.questions;
  const answers = qs.map(() => null);
  const blanks = {}; qs.forEach((q,i) => { if (q.blank != null) blanks[q.blank] = i; });
  const optList = i => qs[i].options.map((o,j) => `<option value="${j}" ${answers[i] === j ? 'selected' : ''}>${esc(o)}</option>`).join('');
  const gapSel = n => { const i = blanks[n]; if (i == null) return "______"; return `<select class="gap" data-qi="${i}" aria-label="Blank ${n}"><option value="">(${n}) choose…</option>${optList(i)}</select>`; };
  const plain = n => `<b>(${n}) ______</b>`;
  const para = (t, fill) => esc(t).split(/\n\s*\n|\n/).filter(x => x.trim()).map(x => `<p>${x.replace(/\[\[(\d+)\]\]/g, (_, n) => fill(+n))}</p>`).join('');
  const isGapPassage = ps => /\[\[\d+\]\]/.test((ps && ps.text) || '');
  const readPs = data.passages.filter(ps => !isGapPassage(ps));
  const gapPs = data.passages.filter(isGapPassage);
  const block = (ps, fill) => `<div class="pblock">${ps.heading ? `<h3>${esc(ps.heading)}</h3>` : ''}${para(ps.text || '', fill || plain)}</div>`;
  const diag = data.diagram && Array.isArray(data.diagram.columns) ? `<div class="pblock"><h3>${esc(data.diagram.title || 'Diagram')}</h3><div class="tablewrap"><table><tr>${data.diagram.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${(data.diagram.rows||[]).map(r => `<tr>${(Array.isArray(r) ? r : Object.values(r)).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></div>` : '';
  // a blank only becomes an in-text menu if its number really appears in the text; any other blank is asked as a normal question
  const markers = new Set(gapPs.flatMap(ps => [...(ps.text || '').matchAll(/\[\[(\d+)\]\]/g)].map(m => +m[1])));
  let mcIdx = qs.map((q,i) => i).filter(i => qs[i].blank == null || !markers.has(qs[i].blank));
  let gapIdx = qs.map((q,i) => i).filter(i => qs[i].blank != null && markers.has(qs[i].blank));
  const what = {R1:'message', R2:'diagram', R3:'article', R4:'article'}[p.key] || 'text';
  const leftBase = `<p class="ihead">Read this ${what}.</p>` + (p.key === 'R2' ? diag + readPs.map(ps => block(ps)).join('') : readPs.map(ps => block(ps)).join('') + diag);
  const mcIntro = p.key === 'R3'
    ? 'For each statement, pick the paragraph (A, B, C or D) where that information appears. Pick E if none of the paragraphs contains it.'
    : 'Answer each question by picking the best choice from its menu (▾), based on what you read.';
  const firstNum = gapIdx.length && p.key === 'R2' ? gapIdx.length : 0;   // Part 2 numbers its questions after the 5 blanks
  const mcList = () => mcIdx.map((i,k) => `<div class="q"><p class="qtext"><span class="qn">${firstNum + k + 1}</span><span>${esc(qs[i].q || ('Blank ' + qs[i].blank))}</span></p><select class="gap mcsel" data-qi="${i}" aria-label="Answer to question ${firstNum + k + 1}"><option value="">Choose…</option>${optList(i)}</select></div>`).join('');
  const gapIntro = p.key === 'R2'
    ? 'This email is about the diagram. Fill in each blank by picking the best word or phrase from its menu (▾).'
    : `Below is a ${p.key === 'R4' ? 'reader’s comment on the article' : 'reply to the message'}. Fill in each blank by picking the best word or phrase from its menu (▾).`;
  const gapRight = () => `<p class="ihead">${gapIntro}</p>${gapPs.map(ps => block(ps, gapSel)).join('')}`;
  const mcPage = () => ({left: leftBase, right: `<p class="ihead">${mcIntro}</p>${mcList()}`});
  const gapPage = () => ({left: leftBase, right: gapRight()});
  // Part 2: diagram on the left; the email with its blanks, then the questions, on the right (one screen)
  const r2Page = () => ({left: leftBase, right: gapRight() + (mcIdx.length ? `<div class="qsplit"></div><p class="ihead">${mcIntro}</p>${mcList()}` : '')});
  // every part is one scrolling page: the reading on the left; on the right, its question groups stacked one above the other
  const onePage = () => ({left: leftBase, right: [mcIdx.length ? `<p class="ihead">${mcIntro}</p>${mcList()}` : '', gapIdx.length ? gapRight() : ''].filter(Boolean).join('<div class="qsplit"></div>')});
  const pages = [p.key === 'R2' && gapIdx.length ? r2Page : onePage];
  let pg = 0, sent = false;
  shell('<div id="rpage"></div>');
  const save = () => $$('select[data-qi]').forEach(s => { answers[+s.dataset.qi] = s.value === '' ? null : +s.value; });
  const show = () => {
    const pageData = pages[pg]();
    $('#rpage').innerHTML = `<div class="split"><div class="card passage">${pageData.left}</div><div class="card passage">${pageData.right}${pages.length > 1 ? `<p class="small muted">Page ${pg+1} of ${pages.length} in this part</p>` : ''}</div></div>`;
    window.scrollTo(0, 0);
    armPanels();
  };
  const submit = () => {
    if (sent || S.run !== run) return; sent = true;
    save(); $$('.modalback').forEach(m => m.remove());
    const items = qs.map((q,i) => ({...q, q: q.blank != null ? `Blank ${q.blank}` : q.q, chosen:answers[i]}));
    finishPart({type:'mc', key:p.key, name:p.name, title:data.title, items, correct:items.filter(it => it.chosen === it.answer).length, total:items.length});
  };
  const next = () => { save(); $$('.modalback').forEach(m => m.remove()); if (pg < pages.length - 1) { pg++; show(); } else submit(); };
  setNext(() => $$('select[data-qi]').some(s => s.value === '') ? confirmSkip(SKIP_MSG, next) : next());
  show();
  if (run.timed) partTimer(p.mins, submit);
}

/* spell check: the app's own checker (tablets and phones often show no underlines for web text boxes) */
let SPELLER = null;
function loadSpeller(){
  if (SPELLER) return SPELLER;
  SPELLER = (async () => {
    if (typeof Typo === 'undefined') await new Promise((res, rej) => {
      const sc = document.createElement('script'); sc.src = 'spell/typo.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    });
    const get = f => fetch('spell/' + f).then(r => { if (!r.ok) throw new Error(f); return r.text(); });
    const [aff, dic] = await Promise.all([get('en_CA.aff'), get('en_CA.dic')]);
    await new Promise(r => setTimeout(r, 0));
    return new Typo('en_CA', aff, dic);
  })();
  SPELLER.catch(e => { console.warn('Spell checker not available, using the browser one', e); });
  return SPELLER;
}
function attachSpell(ta, extraText){
  const wrap = document.createElement('div'); wrap.className = 'spwrap';
  ta.parentNode.insertBefore(wrap, ta); wrap.appendChild(ta);
  const mir = document.createElement('div'); mir.className = 'spmirror'; mir.setAttribute('aria-hidden', 'true'); wrap.insertBefore(mir, ta);
  const fix = document.createElement('div'); fix.className = 'spfix'; wrap.after(fix);
  const allow = new Set(String(extraText || '').match(/[A-Za-z][A-Za-z']*/g) || []);
  const seen = new Map(), sugg = new Map();
  let typo = null, timer = 0, on = () => S.ui.spell;
  const ok = w => {
    if (seen.has(w)) return seen.get(w);
    let v = allow.has(w) || /^[A-Z]{2,5}s?$/.test(w) || w.length < 2 || typo.check(w) || typo.check(w.toLowerCase());
    if (!v && /'s$/i.test(w)) v = ok(w.slice(0, -2));
    if (!v && /s'$/i.test(w)) v = ok(w.slice(0, -1));
    seen.set(w, v); return v;
  };
  const escH = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const draw = () => {
    if (!typo || !on()) { mir.innerHTML = ''; fix.innerHTML = ''; return; }
    const v = ta.value, caret = document.activeElement === ta ? ta.selectionEnd : -1;
    const re = /[A-Za-z][A-Za-z'’]*[A-Za-z]|[A-Za-z]/g; let m, last = 0, html = '';
    const bad = [];
    while ((m = re.exec(v))) {
      const raw = m[0], w = raw.replace(/’/g, "'"), end = m.index + raw.length;
      if (end === caret && m.index < caret) continue;   /* don't flag the word still being typed */
      if (/[0-9_@]/.test(v[end] || '') || /[0-9_@\/]/.test(v[m.index - 1] || '')) continue;
      if (ok(w)) continue;
      html += escH(v.slice(last, m.index)) + '<mark>' + escH(raw) + '</mark>'; last = end;
      if (!bad.includes(w)) bad.push(w);
    }
    mir.innerHTML = html + escH(v.slice(last)) + '\n ';
    const sb = ta.offsetWidth - ta.clientWidth - 2; mir.style.paddingRight = (14 + Math.max(0, sb)) + 'px';
    mir.scrollTop = ta.scrollTop;
    if (open && !bad.includes(open)) open = null;
    if (!bad.length) { fix.innerHTML = ''; return; }
    if (open) {
      const sg = sugg.get(open);
      fix.innerHTML = `<span class="small muted"><b>${escH(open)}</b> →</span>` + (sg ? (sg.length ? sg.map(x => `<button type="button" data-w="${escH(open)}" data-s="${escH(x)}"><b>${escH(x)}</b></button>`).join('') : '<span class="small muted">no suggestions</span>') : '<span class="small muted">finding suggestions…</span>')
        + `<button type="button" data-keep="${escH(open)}" title="Stop marking this word">Keep it</button><button type="button" data-back="1">Back</button>`;
      return;
    }
    fix.innerHTML = '<span class="small muted">Spelling — tap a word for suggestions:</span>' + bad.slice(0, 10).map(w => `<button type="button" data-open="${escH(w)}">${escH(w)}</button>`).join('');
  };
  let open = null;
  /* order suggestions the way people usually misspell: swapped letters (recieve), missing or extra double letters (realy, untill) first */
  const isV = c => 'aeiouy'.includes(c);
  const cost = (a, b) => {
    const m = a.length, n = b.length, d = [];
    for (let i = 0; i <= m; i++) { d[i] = [i]; }
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
      const del = (a[i-1] === a[i-2] || a[i-1] === a[i]) ? 0.5 : 1, ins = (b[j-1] === b[j-2] || b[j-1] === b[j]) ? 0.5 : 1;
      const sub = a[i-1] === b[j-1] ? 0 : (isV(a[i-1]) && isV(b[j-1]) ? 0.7 : 1);
      d[i][j] = Math.min(d[i-1][j] + del, d[i][j-1] + ins, d[i-1][j-1] + sub);
      if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 0.5);
    }
    return d[m][n];
  };
  const rank = (w, list) => {
    const lw = w.toLowerCase(), lower = w === lw;
    let c = [...new Set(list)];
    if (lower && c.some(x => x === x.toLowerCase())) c = c.filter(x => x === x.toLowerCase());
    else if (!lower) c = [...new Set(c.map(x => x === x.toLowerCase() ? x[0].toUpperCase() + x.slice(1) : x))];
    return c.map((x, i) => ({x, i, sc: cost(lw, x.toLowerCase()) + (x[0].toLowerCase() !== lw[0] ? 0.3 : 0)}))
      .sort((p, q) => p.sc - q.sc || p.i - q.i).slice(0, 4).map(o => o.x);
  };
  const later = () => { clearTimeout(timer); timer = setTimeout(draw, 250); };
  fix.addEventListener('mousedown', e => e.preventDefault());   /* keep the keyboard / caret where it is */
  fix.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.back) { open = null; draw(); return; }
    if (b.dataset.keep) { allow.add(b.dataset.keep); seen.set(b.dataset.keep, true); open = null; draw(); return; }
    if (b.dataset.open) {
      open = b.dataset.open; draw();
      if (!sugg.has(open)) setTimeout(() => { const w = open; let sg = []; try { sg = rank(w, typo.suggest(w, 10)); } catch(err) {} sugg.set(w, sg); if (open === w) draw(); }, 30);
      return;
    }
    const w = b.dataset.w, to = b.dataset.s; open = null;
    const rx = new RegExp("(^|[^A-Za-z'’])(" + w.replace(/[^A-Za-z']/g, '').replace(/'/g, "['’]") + ")(?![A-Za-z])");
    const i = ta.value.search(rx); if (i < 0) return;
    const mm = ta.value.slice(i).match(rx), start = i + mm[1].length, len = mm[2].length;
    ta.focus(); ta.setSelectionRange(start, start + len);
    if (!document.execCommand || !document.execCommand('insertText', false, to)) { ta.setRangeText(to, start, start + len, 'end'); }
    ta.dispatchEvent(new Event('input'));
  });
  ta.addEventListener('input', later);
  ta.addEventListener('blur', later);
  ta.addEventListener('scroll', () => { mir.scrollTop = ta.scrollTop; });
  try { new ResizeObserver(() => { mir.scrollTop = ta.scrollTop; later(); }).observe(ta); } catch(e) {}
  loadSpeller().then(t => { typo = t; if (on()) ta.spellcheck = false; draw(); }, () => {});
  return { refresh(){ if (typo) ta.spellcheck = false; draw(); }, ready: () => !!typo };
}

/* writing */
function renderWriting(data, p){
  const run = S.run;
  const info = p.key === 'W1' ? data.situation : data.context;
  const task = p.key === 'W1'
    ? `<p class="ihead">Write an email of 150 to 200 words that covers all of these points:</p><ul class="tight">${(data.bullets||[]).map(b => `<li>${esc(b)}</li>`).join('')}</ul>`
    : `<p class="ihead">Pick Option A or Option B and give your reasons, in 150 to 200 words.</p><div class="grid"><div class="optcard" style="cursor:default"><b>Option A</b><span>${esc(data.optionA)}</span></div><div class="optcard" style="cursor:default"><b>Option B</b><span>${esc(data.optionB)}</span></div></div>`;
  const taskText = p.key === 'W1' ? `${data.situation} Write an email that: ${(data.bullets||[]).join('; ')}.` : `${data.context} Option A: ${data.optionA}. Option B: ${data.optionB}. Choose one and explain.`;
  shell(`<div class="split"><div class="card sticky"><p class="ihead">The situation</p><p>${esc(info)}</p></div>
    <div class="card">${task}<textarea id="wresp" lang="en-CA" spellcheck="${S.ui.spell ? 'true' : 'false'}" autocorrect="off" autocomplete="off" aria-label="Your response" placeholder="Start typing your response…"></textarea>
    <div class="row between"><span id="wc" class="pill warn">0 words</span>
      <label class="toggle small" title="The real CELPIP Writing test has a spell checker that underlines misspelled words. It does not check grammar."><input type="checkbox" id="spellToggle" ${S.ui.spell ? 'checked' : ''}> Spell check <span class="muted" id="spellNote">${S.ui.spell ? '(on, as in the real test)' : '(off: extra challenge)'}</span></label></div></div></div>`);
  const ta = $('#wresp'), wc = $('#wc'), started = Date.now();
  const sp = attachSpell(ta, info + ' ' + taskText);
  $('#spellToggle').addEventListener('change', e => {
    S.ui.spell = e.target.checked; saveUI();
    ta.spellcheck = S.ui.spell && !sp.ready(); sp.refresh();
    if (sp.ready()) { $('#spellNote').textContent = S.ui.spell ? '(on, as in the real test)' : '(off: extra challenge)'; return; }
    $('#spellNote').textContent = S.ui.spell ? '(on, as in the real test)' : '(off: extra challenge)';
    // browsers only redraw spelling marks when the field is edited or refocused
    const pos = ta.selectionStart; ta.blur(); ta.value = ta.value; ta.focus(); try { ta.setSelectionRange(pos, pos); } catch(err) {}
  });
  ta.addEventListener('input', () => { const n = words(ta.value); wc.textContent = n + ' words'; wc.className = 'pill ' + (n >= 150 && n <= 200 ? 'good' : 'warn'); });
  let sent = false;
  const submit = () => {
    if (sent || S.run !== run) return; sent = true;
    $$('.modalback').forEach(m => m.remove());
    const r = {type:'task', kind:'writing', key:p.key, name:p.name, taskText, response:ta.value.trim(), wc:words(ta.value), mins:Math.round((Date.now()-started)/60000)};
    score(r, 'writing'); finishPart(r);
  };
  setNext(() => words(ta.value) === 0 ? confirmSkip('You haven’t written anything for this task yet. If you go on, it will be scored as blank.', submit) : submit());
  if (run.timed) partTimer(p.mins, submit);
}

/* speaking */
function renderSpeaking(task, p){
  const run = S.run, mock = run.mode === 'mock';
  let phase = p.choose ? 'choose' : 'prep', choice = null, finished = false;
  const imgHTML = () => {
    const im = task.img;
    if (im && typeof im === 'object' && im.art) return `<figure class="photo"><img class="scene" src="${esc(im.src)}" alt="Picture for this task"><figcaption class="small muted">Picture drawn by AI${im.maker === 'set' ? ' (Pollinations.ai)' : ''}</figcaption></figure>`;
    if (im && typeof im === 'object') {
      const credit = [im.title ? '“' + im.title.slice(0, 80) + '”' : '', im.by ? 'by ' + im.by.slice(0, 60) : '', im.lic].filter(Boolean).join(' ');
      return `<figure class="photo"><img class="scene" src="${esc(im.src)}" data-local="${esc(im.local)}" alt="Picture for this task" referrerpolicy="no-referrer" onerror="if(this.dataset.local&&this.src!==this.dataset.local){this.src=this.dataset.local}">`
        + `<figcaption class="small muted">Photo${credit ? ': ' + esc(credit) : ''}${im.link ? ` · <a href="${esc(im.link)}" target="_blank" rel="noopener noreferrer">source</a>` : ''}</figcaption></figure>`;
    }
    if (im) return `<img class="scene" src="${im}" alt="Picture for this task">`;
    return task.desc ? `<div class="note small"><b>Picture:</b> no picture could be made, so here is what it shows. ${esc(task.desc)}</div>` : '';
  };
  const details = o => `<ul class="small">${(o.details||[]).map(d => `<li>${esc(d)}</li>`).join('')}</ul>`;
  const optCard = (o, k) => `<button class="optcard" data-choose="${k}" aria-pressed="${choice===k}" ${phase!=='choose'?'disabled':''}><b>${esc(o.name || 'Option '+k)}</b>${details(o)}</button>`;
  function promptHTML(){
    if (p.key === 'S5') {
      if (phase === 'choose') return `<p class="ihead">${esc(task.situation)} Choose the option that you prefer.</p><div class="grid">${optCard(task.A,'A')}${optCard(task.B,'B')}</div>`;
      const mine = choice === 'B' ? task.B : task.A, other = choice === 'B' ? task.A : task.B;
      return `<p class="ihead">${esc(task.persuade)}</p><div class="grid"><div class="optcard" style="cursor:default;border-color:var(--accent)"><span class="small muted">Your choice</span><b>${esc(mine.name)}</b>${details(mine)}</div><div class="optcard" style="cursor:default"><span class="small muted">Their choice</span><b>${esc(other.name)}</b>${details(other)}</div></div>`;
    }
    let h = `<p class="ihead">${esc(task.prompt)}</p>`;
    if (task.options) h += `<ul class="tight">${task.options.map(o => `<li>${esc(o)}</li>`).join('')}</ul>`;
    if (task.extra) h += `<p><b>${esc(task.extra)}</b></p>`;
    return h + imgHTML();
  }
  function boxHTML(){
    if (phase === 'choose') return statusBox('⏱', 'Selection Time', '<div class="val" id="ptime"></div>');
    if (phase === 'prep') return statusBox('⏱', 'Preparation Time', '<div class="val" id="ptime"></div>');
    return statusBox('●', 'Recording…', '<div class="pbar"><i id="pb"></i></div><div class="val" id="ptime"></div>', true);
  }
  function answerHTML(){
    const mic = micAvailable();
    return `<div class="spkans">
      ${mic ? '<button class="btn primary big mic" id="micbtn">🎙 Start microphone</button>' : ''}
      <label for="spk" class="small muted">${mic ? (!C.dict && (IS_TOUCH || !SR || S.srOff) && wantRecording() ? 'Your voice is recorded and written out in the feedback after the task. You can also type here.' : 'Your words appear here as you talk. You can also type.') : 'Talk using your keyboard’s mic key (on a phone), or type what you would say.'}</label>
      <textarea id="spk" style="min-height:160px" placeholder="${mic ? 'Tap Start microphone and talk…' : 'Tap the 🎙 key on your phone keyboard and talk…'}"></textarea>
      <div class="row between small"><span id="partial" class="muted"></span><span id="spkwc" class="muted">0 words</span></div>
    </div>`;
  }
  function draw(){
    shell(`<div class="card spk">${promptHTML()}${boxHTML()}${phase === 'speak' ? answerHTML() : ''}</div>`);
    const pi = $('#phaseinfo');
    if (pi) { pi.hidden = false; pi.innerHTML = `${p.choose ? `Selection: <b>${p.choose} seconds</b> · ` : ''}Preparation: <b>${p.prep} seconds</b> · Recording: <b>${p.speak} seconds</b>`; }
    const el = $('#ptime');
    if (phase === 'choose') {
      $$('[data-choose]').forEach(b => b.onclick = () => { choice = b.dataset.choose; $$('[data-choose]').forEach(x => x.setAttribute('aria-pressed', x.dataset.choose === choice)); });
      const go = () => { clearTimers(); if (!choice) choice = 'A'; phase = 'prep'; draw(); };
      countdown(p.choose, el, go, 10);
      setNext(mock ? null : go);
    } else if (phase === 'prep') {
      const go = () => { clearTimers(); phase = 'speak'; draw(); const box = $('.statusbox'); if (box && window.innerWidth < 900) box.scrollIntoView({block:'start'}); };
      countdown(p.prep, el, go, 10);
      setNext(mock ? null : go);
    } else {
      const ta = $('#spk');
      ta.addEventListener('input', () => { $('#spkwc').textContent = words(ta.value) + ' words'; });
      const mb = $('#micbtn');
      if (mb) mb.onclick = () => {
        if (!C.dict) {
          if ((IS_TOUCH || !SR || S.srOff) && wantRecording()) { recOnlyToggle(mb); return; }
          if (srWant) srStop(); else { recStart().then(() => { const pv = $('#partial'); if (recState && pv && !pv.textContent) pv.innerHTML = 'Recording' + VU; }); srStart(ta); }
          return;
        }
        if (C.dict.active()) { C.dict.stop().catch(() => {}); return; }
        dictTarget = ta;
        C.dict.start().catch(e => {
          if (e && (e.code === 'not_granted' || e.code === 'unavailable')) { S.dictOff = true; mb.hidden = true; $('#partial').textContent = 'Microphone not available here. Use your keyboard’s mic key or type.'; }
          else if (e && e.code !== 'stopped' && e.code !== 'dismissed') $('#partial').textContent = 'The microphone did not start. Tap again.';
        });
      };
      countdown(p.speak, el, finish, 10, (left, tot) => { const pb = $('#pb'); if (pb) pb.style.width = ((tot - left) / tot * 100) + '%'; });
      setNext(mock ? null : finish);
    }
  }
  async function finish(){
    if (finished) return; finished = true; clearTimers();
    try { if (C.dict && C.dict.active()) await C.dict.stop(); } catch(e) {}
    if (srWant || srRec) { srStop(); await new Promise(r => setTimeout(r, 700)); srRec = null; }
    const clip = await recStop();
    const text = ($('#spk') && $('#spk').value || '').trim();
    dictTarget = null;
    if (S.run !== run) return;
    let taskText = task.taskText;
    if (p.key === 'S5') { const mine = choice === 'B' ? task.B : task.A, other = choice === 'B' ? task.A : task.B; taskText += ` The test taker chose "${mine.name}" (${(mine.details||[]).join('; ')}) over "${other.name}" (${(other.details||[]).join('; ')}).`; }
    const r = {type:'task', kind:'speaking', key:p.key, name:p.name, taskText, response:text, wc:words(text), secs:p.speak};
    if (clip) CLIPS.set(r, clip);
    if (!text && !clip) { r.err = {code:'no_speech'}; finishPart(r); return; }
    score(r, 'speaking'); finishPart(r);
  }
  draw();
}

/* results */
async function endRun(){
  const run = S.run;
  run.done = true;
  const pending = run.results.filter(r => r.scoring);
  if (pending.length) {
    shell(`<div class="card center"><div class="spin" aria-hidden="true"></div><h3>Rating your ${run.section}</h3><p class="muted small">Each response is checked against the four CELPIP criteria. This takes about a minute.</p></div>`);
    await Promise.all(pending.map(r => r.scoring));
  }
  if (S.run !== run) return;
  await saveRun(run);
  if (S.run !== run) return;
  renderSummary();
}
function summarize(run){
  const mc = run.results.filter(r => r.type === 'mc');
  if (mc.length) {
    const correct = mc.reduce((n,r) => n + r.correct, 0), total = mc.reduce((n,r) => n + r.total, 0);
    return {level: rawToLevel(run.section, correct, total), raw:correct, total};
  }
  const lv2 = run.results.map(r => r.fb && r.fb.level).filter(n => Number.isFinite(n));
  return {level: lv2.length ? Math.round(lv2.reduce((a,b) => a+b, 0) / lv2.length) : null, detail: lv2.length ? lv2.map(lv).join(' · ') : 'not rated'};
}
async function saveRun(run){
  const sum = summarize(run);
  const single = run.parts.length === 1;
  const doc = {kind:'attempt', ts:Date.now(), section:run.section, part: single ? run.parts[0].key : 'all', partName: single ? run.parts[0].name : 'Whole section', mode:run.mode, level:sum.level, raw:sum.raw ?? null, total:sum.total ?? null, detail:sum.detail ?? null, mockId:run.mockId || null};
  if (!run.savedTs) run.savedTs = doc.ts; else doc.ts = run.savedTs;
  await saveDoc(run.attId, doc);
  if (run.mode === 'mock' && run.mockId) {
    const m = S.mocks[run.mockId] || run.mockDoc || {kind:'mock', id:run.mockId, created:Date.now(), sections:{}};
    const nm = {kind:'mock', id:m.id, created:m.created, sections:{...(m.sections||{}), [run.section]:{level:sum.level, raw:sum.raw ?? null, total:sum.total ?? null}}};
    S.mocks[run.mockId] = nm;
    await saveDoc(run.mockId, nm);
  }
}
function reviewHTML(items){
  return items.map((it,k) => { const ok = it.chosen === it.answer; return `<div class="rv ${ok?'ok':'bad'}">
    <p><span class="mk">${ok?'✓':'✗'}</span>${k+1}. ${esc(it.q)}</p>
    <p class="small">Your answer: <b>${it.chosen == null ? '(none)' : esc(it.options[it.chosen])}</b>${ok ? '' : ` · Correct: <b>${esc(it.options[it.answer])}</b>`}</p>
    ${it.explanation ? `<p class="small muted">${esc(it.explanation)}</p>` : ''}</div>`; }).join('');
}
function fbHTML(r, i){
  const resp = `<details><summary>Your response (${r.wc} words)</summary><p style="white-space:pre-wrap">${esc(r.response || '(empty)')}</p></details>`;
  if (!r.fb) return `<div class="card"><div class="row between"><h3>${esc(r.name)}</h3><span class="pill bad">Not rated</span></div><p class="muted">${esc(errMsg(r.err))}</p><div class="row"><button class="btn" data-act="rescore" data-i="${i}">Rate again</button></div>${resp}</div>`;
  const fb = r.fb, list = a => Array.isArray(a) && a.length ? `<ul class="tight">${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="muted small">None.</p>';
  const corr = Array.isArray(fb.corrections) && fb.corrections.length ? `<div class="tablewrap"><table><tr><th>You said / wrote</th><th>Better</th><th>Why</th></tr>${fb.corrections.map(c => `<tr><td class="del">${esc(c.original)}</td><td class="ins">${esc(c.better)}</td><td class="small">${esc(c.why)}</td></tr>`).join('')}</table></div>` : '<p class="muted small">No corrections needed.</p>';
  return `<div class="card">
    <div class="row between"><div><p class="eyebrow">${esc(r.name)}</p><p>${esc(fb.summary || '')}</p></div><div style="text-align:right"><span class="levelbig">${lv(fb.level)}</span><p class="small muted">estimated level</p></div></div>
    ${meter(fb.level, S.settings.target)}
    ${r.ratedBy || r.heard ? `<p class="small muted">Rated by ${esc(r.ratedBy || 'the AI')}${r.heard ? ' · it listened to your recording' : ''}</p>` : ''}
    <div class="dims">${fb.dimensions.map(d => `<div><div class="dimhead"><span>${esc(d.name)}</span><span>${lv(d.level)}</span></div><div class="bar"><i style="width:${clamp(+d.level||0,0,12)/12*100}%"></i></div><p class="small muted">${esc(d.comment)}</p></div>`).join('')}</div>
    <div class="grid2"><div><h3>What worked</h3>${list(fb.strengths)}</div><div><h3>To reach CLB ${S.settings.target}+</h3>${list(fb.improvements)}</div></div>
    <h3>Corrections</h3>${corr}
    ${Array.isArray(fb.upgrades) && fb.upgrades.length ? `<h3>Phrases to borrow</h3>${list(fb.upgrades)}` : ''}
    <details><summary>Model answer</summary><p style="white-space:pre-wrap">${esc(fb.model_answer || '')}</p></details>
    ${resp}
  </div>`;
}
function renderSummary(){
  const run = S.run, sec = SECTIONS[run.section], sum = summarize(run);
  const nextSec = run.mode === 'mock' ? SEC_ORDER.find(s => s !== run.section && !((S.mocks[run.mockId] || {}).sections || {})[s]) : null;
  const mock = run.mode === 'mock' ? S.mocks[run.mockId] : null;
  const mockDone = mock && SEC_ORDER.every(s => mock.sections && mock.sections[s]);
  let body = `<div class="card">
    <div class="row between"><div><p class="eyebrow">${sec.name} result</p><h2>${run.parts.length === 1 ? esc(run.parts[0].name) : 'Whole section'}</h2>
      ${sum.total ? `<p class="muted">${sum.raw} of ${sum.total} correct${run.parts.length < sec.parts.length ? ' (level scaled from this part only)' : ''}</p>` : ''}</div>
      <div style="text-align:right"><span class="levelbig">${lv(sum.level)}</span><p class="small muted">estimated CELPIP level</p></div></div>
    ${meter(sum.level, S.settings.target)}
    <div class="row">
      ${nextSec ? `<button class="btn primary" data-act="next-section" data-sec="${nextSec}">Next: ${SECTIONS[nextSec].name}</button>` : ''}
      ${nextSec === 'speaking' ? '<button class="btn" data-act="nav" data-v="home">Do Speaking later or on my phone</button>' : ''}
      ${run.mode !== 'mock' ? `<button class="btn primary" data-act="again">Practise again with new content</button>` : ''}
      <button class="btn" data-act="nav" data-v="progress">See progress</button>
    </div></div>`;
  if (mockDone) body += `<div class="card"><p class="eyebrow">Mock exam complete</p><div class="grid">${SEC_ORDER.map(s => `<div><p class="small muted">${SECTIONS[s].name}</p><span class="levelbig" style="font-size:40px">${lv(mock.sections[s].level)}</span></div>`).join('')}</div></div>`;
  run.results.forEach((r, i) => {
    if (r.type === 'mc') {
      body += `<div class="card"><div class="row between"><h3>${esc(r.name)}</h3><span class="pill ${r.correct/r.total >= .75 ? 'good' : r.correct/r.total >= .55 ? 'warn' : 'bad'}">${r.correct}/${r.total}</span></div>
        <details><summary>Review answers</summary>${reviewHTML(r.items)}</details>
        ${r.transcript ? `<details><summary>Transcript</summary><div class="transcript small">${r.transcript.map(l => `<p><b>${esc(l.speaker)}:</b> ${esc(l.text)}</p>`).join('')}</div></details>` : ''}</div>`;
    } else body += fbHTML(r, i);
  });
  shell(body);
}

/* ---------- actions ---------- */
const ACT = {
  nav: b => { if (S.run && !S.run.done) return; S.run = null; S.view = b.dataset.v; render(); window.scrollTo(0,0); },
  mock: async () => {
    const id = 'mock-' + Date.now();
    const doc = {kind:'mock', id, created:Date.now(), sections:{}};
    S.mocks[id] = doc;
    saveDoc(id, doc);
    startRun({mode:'mock', section:'listening', mockId:id});
    S.run.mockDoc = doc;
  },
  resume: b => { const m = S.mocks[b.dataset.mock]; startRun({mode:'mock', section:b.dataset.sec, mockId:b.dataset.mock}); S.run.mockDoc = m; },
  practice: b => startRun({mode:'practice', section:b.dataset.sec, partKey:b.dataset.part}),
  begin: () => loadPart(),
  retry: () => { if (S.run.autoRetry) S.run.autoRetry[S.run.idx] = false; loadPart(); },
  theme: () => { S.ui.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; saveUI(); applyTheme(); render(); },
  defer: () => quitRun(),
  signin: () => cloudSignIn(),
  signout: () => cloudSignOut(),
  'save-fb': () => {
    const m = $('#fbMsg'), raw = ($('#fbcfg').value || '').trim();
    // accepts plain JSON or the snippet Firebase shows (const firebaseConfig = { apiKey: "..." , ... };)
    let cfg = null;
    try { cfg = JSON.parse(raw); } catch (e) {
      const body = (raw.match(/\{[\s\S]*\}/) || [''])[0];
      try { cfg = JSON.parse(body.replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}')); } catch (e2) { cfg = null; }
    }
    if (!cfg || !cfg.apiKey || !cfg.projectId || !cfg.authDomain) { m.textContent = 'That doesn’t look like a Firebase web config. It needs apiKey, authDomain and projectId.'; return; }
    try { localStorage.setItem(FBKEY, JSON.stringify(cfg)); } catch (e) {}
    cloudInit();
  },
  exit: b => {
    if (b.dataset.armed) return quitRun();
    b.dataset.armed = '1'; b.textContent = 'Exit and lose this section?';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Exit'; } }, 4000);
  },
  'next-section': b => { const id = S.run.mockId; startRun({mode:'mock', section:b.dataset.sec, mockId:id}); S.run.mockDoc = S.mocks[id]; },
  again: () => { const r = S.run; startRun({mode:'practice', section:r.section, partKey:r.parts.length === 1 ? r.parts[0].key : 'all'}); },
  'save-ai': () => { readAIInputs(); render(); const m = $('#aiMsg'); if (m) m.textContent = provider() ? 'Saved. Now using ' + PNAME[provider()] + '.' : 'Saved. No provider is ready yet.'; },
  'test-ai': async () => {
    readAIInputs();
    const m = $('#aiMsg'); m.textContent = 'Testing…';
    try { await askJSON('Reply with only this JSON: {"ok": true}'); m.textContent = '✓ Connected to ' + PNAME[provider()] + '.'; }
    catch (e) { m.textContent = errMsg(e); }
  },
  export: () => {
    const ta = $('#backup');
    ta.value = JSON.stringify({app:'twelve-prep', v:1, docs:[...S.attempts, ...Object.values(S.mocks)]});
    ta.select();
    const m = $('#bkMsg');
    try { navigator.clipboard.writeText(ta.value).then(() => { m.textContent = 'Copied. Paste it into the app on your other device.'; }, () => { m.textContent = 'Selected. Copy it, then paste it on your other device.'; }); }
    catch (e) { m.textContent = 'Selected. Copy it, then paste it on your other device.'; }
  },
  import: async () => {
    const m = $('#bkMsg');
    let data; try { data = JSON.parse($('#backup').value); } catch (e) { m.textContent = 'That isn’t valid progress data. Copy it again from the other device.'; return; }
    const docs = (data && Array.isArray(data.docs) ? data.docs : []).filter(d => d && d.id && (d.kind === 'attempt' || d.kind === 'mock'));
    for (const d of docs) await saveDoc(String(d.id), d);
    m.textContent = `Imported ${docs.length} item${docs.length === 1 ? '' : 's'}.`;
  },
  rescore: async b => {
    const run = S.run, r = run.results[+b.dataset.i];
    b.disabled = true; b.textContent = 'Rating…';
    await score(r, r.kind);
    if (S.run !== run) return;
    await saveRun(run); renderSummary();
  }
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
app.addEventListener('change', e => {
  if (e.target.id === 'timedToggle') S.timed = e.target.checked;
  if (e.target.id === 'spellSetting') { S.ui.spell = e.target.checked; saveUI(); }
  if (e.target.id === 'syncAI') {
    S.ui.syncAI = e.target.checked; saveUI();
    if (S.ui.syncAI) { S.ai.ts = Date.now(); saveAI(); pushAI(); }
    else if (CLOUD.user && C.db) coll().doc('ai-prefs').set({kind:'ai-off', ts:Date.now()}).catch(() => {});   // removes the copy of the keys from the cloud
    render();
  }
  if (e.target.name === 'theme') { S.ui.theme = e.target.value; saveUI(); applyTheme(); render(); }
  if (e.target.name === 'prov') { readAIInputs(); S.ai.provider = e.target.value; saveAI(); render(); }
  if (e.target.id === 'targetSel') {
    S.settings.target = +e.target.value;
    saveDoc('settings', {kind:'settings', target:S.settings.target});
    render();
  }
});

render();
</script>
